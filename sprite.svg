<path class="ic-d cx-r" pathLength="1" d="M91.6667 50H75" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ic-d cx-l" pathLength="1" d="M25 50H8.33337" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ic-d cx-t" pathLength="1" d="M50 25V8.33331" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ic-d cx-b" pathLength="1" d="M50 91.6667V75" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ic-b cx-core" d="M60 50C60 55.5228 55.5228 60 50 60C44.4772 60 40 55.5228 40 50C40 44.4772 44.4772 40 50 40C55.5228 40 60 44.4772 60 50ZM42.5 50C42.5 54.1421 45.8579 57.5 50 57.5C54.1421 57.5 57.5 54.1421 57.5 50C57.5 45.8579 54.1421 42.5 50 42.5C45.8579 42.5 42.5 45.8579 42.5 50Z" fill="currentColor"/>
</symbol>

