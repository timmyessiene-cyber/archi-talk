<path class="ic-d ic-b gr-sq" pathLength="1" style="--d:.6s" d="M87.5 58.3333H58.3334V87.5H87.5V58.3333Z" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ic-d ic-b gr-sq" pathLength="1" style="--d:.9s" d="M41.6667 58.3333H12.5V87.5H41.6667V58.3333Z" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

