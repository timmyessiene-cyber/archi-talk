<path class="ic-d ic-b bk-page bk-r" pathLength="1" style="--d:.15s" d="M91.6667 12.5H66.6667C62.2464 12.5 58.0072 14.2559 54.8816 17.3816C51.7559 20.5072 50 24.7464 50 29.1667V87.5C50 84.1848 51.317 81.0054 53.6612 78.6612C56.0054 76.317 59.1848 75 62.5 75H91.6667V12.5Z" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

