<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  /* shared */
  .ic-d{stroke-dasharray:1 1;stroke-dashoffset:1;animation:ic-draw var(--t,.9s) cubic-bezier(.65,0,.35,1) var(--d,0s) forwards}
  @keyframes ic-draw{to{stroke-dashoffset:0}}
  .ic-b{transform-box:fill-box}

  /* book-open */
  .bk-page{animation:ic-draw .9s cubic-bezier(.65,0,.35,1) var(--d,0s) forwards, bk-breathe 3.2s ease-in-out 1.6s infinite}
  .bk-l{transform-origin:100% 50%}
  .bk-r{transform-origin:0% 50%}
  @keyframes bk-breathe{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.9)}}

  /* grid */
  .gr-sq{animation:ic-draw .7s cubic-bezier(.65,0,.35,1) var(--d,0s) forwards, gr-wave 2.4s ease-in-out calc(1.6s + var(--d,0s)) infinite;transform-origin:center}
  @keyframes gr-wave{0%,40%,100%{transform:scale(1)}20%{transform:scale(.8)}}

  /* crosshair */
  .cx-r{animation:ic-draw .5s ease-out 1s forwards, cx-lockR 2.6s ease-in-out 2s infinite}
  .cx-l{animation:ic-draw .5s ease-out 1s forwards, cx-lockL 2.6s ease-in-out 2s infinite}
  .cx-t{animation:ic-draw .5s ease-out 1s forwards, cx-lockT 2.6s ease-in-out 2s infinite}
  .cx-b{animation:ic-draw .5s ease-out 1s forwards, cx-lockB 2.6s ease-in-out 2s infinite}
  @keyframes cx-lockR{0%,100%{transform:translateX(0)}45%,60%{transform:translateX(-5px)}}
  @keyframes cx-lockL{0%,100%{transform:translateX(0)}45%,60%{transform:translateX(5px)}}
  @keyframes cx-lockT{0%,100%{transform:translateY(0)}45%,60%{transform:translateY(5px)}}
  @keyframes cx-lockB{0%,100%{transform:translateY(0)}45%,60%{transform:translateY(-5px)}}
  .cx-core{transform-origin:center;opacity:0;animation:cx-pop .5s cubic-bezier(.34,1.56,.64,1) 1.2s forwards, cx-pulse 2.6s ease-in-out 2s infinite}
  @keyframes cx-pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
  @keyframes cx-pulse{0%,100%{transform:scale(1)}45%,60%{transform:scale(1.3)}}

  /* box */
  .bx-float{animation:bx-float 3s ease-in-out 2s infinite}
  @keyframes bx-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  /* search */
  .sr-scan{animation:sr-scan 4s ease-in-out 1.8s infinite}
  @keyframes sr-scan{0%,100%{transform:translate(0,0)}20%{transform:translate(5px,-4px)}40%{transform:translate(-3px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,4px)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}.ic-d{stroke-dashoffset:0}.cx-core{opacity:1}}
</style>

<symbol id="book-open" viewBox="0 0 100 100" fill="none">
